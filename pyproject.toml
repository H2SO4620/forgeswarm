[project]
name = "forgeswarm"
version = "0.1.0"
description = "MCP server for multi-agent software engineering: shared task board, shared context, and enforced plan/implement/review/iterate loops."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paul Christian" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "multi-agent", "orchestration", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.10.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
demo = ["openai>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.5", "openai>=1.40"]

[project.scripts]
forgeswarm = "forgeswarm.server:main"

[project.urls]
Homepage = "https://github.com/H2SO4620/forgeswarm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeswarm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
